<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Playfair Display"; src: url("FILE"); font-weight: 400 900; }
  @font-face { font-family: "Playfair Display"; src: url("FILE"); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: "Great Vibes"; src: url("FILE"); }
  /* Brand palette (doc/BRAND_CONTENT_SPEC.md §6) */
  :root { --black: #0A0A0A; --charcoal: #1C1A1A; --antique: #C79A3B; --brass: #A97A1F; --champagne: #E2C98A;
          --ivory: #F5EBDD; --taupe: #B8A089; }
  html, body { margin: 0; width: 1080px; height: 1350px; background: var(--black); overflow: hidden; }
  .c { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff;
       font-family: "Playfair Display", Georgia, serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center center; }
  .shade-top { position: absolute; left: 0; right: 0; top: 0; height: 60%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.30250000000000005) 45%, rgba(0,0,0,0) 100%); }
  .shade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 60%;
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.33) 50%, rgba(0,0,0,0) 100%); }
  .shade-corner { position: absolute; inset: 0;
    background: linear-gradient(145deg, rgba(0,0,0,0.6200000000000001) 0%, rgba(0,0,0,0) 52%); }
  .region { position: absolute; left: 92px; right: 92px; display: flex; flex-direction: column; overflow: hidden; }
  .region.top { justify-content: flex-start; }
  .region.bottom { justify-content: flex-end; }
  .region.middle { justify-content: center; }
  .region.center { align-items: center; text-align: center; justify-content: flex-end; }
  h1 { margin: 0; font-weight: 700; line-height: 1.16; letter-spacing: -0.3px; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
  .sub { margin: 0; line-height: 1.45; font-weight: 400; }
  .sub.gold { color: var(--champagne); }
  .sub.grey, .note { color: #c9c2b6; }
  .note { margin: 0; font-size: 26px; line-height: 1.45; font-family: "Segoe UI", Arial, sans-serif; }
  .accent { color: var(--champagne); }
  .eyebrow { font-family: "Segoe UI", Arial, sans-serif; font-size: 22px; letter-spacing: 5px; text-transform: uppercase;
             color: var(--champagne); margin: 0 0 22px; font-weight: 600; }
  .rule { width: 92px; height: 4px; background: var(--champagne); flex: none; margin: 0 0 34px; }
  .gap { height: 30px; flex: none; }
  .quote { margin: 0; padding-left: 28px; border-left: 4px solid var(--champagne); font-style: italic; line-height: 1.45;
           color: var(--ivory); }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--black); }
  .panel .region { left: 88px; right: 88px; }
  .imgbox { position: absolute; left: 0; right: 0; top: 0; overflow: hidden; }
  .imgbox img { width: 100%; height: 100%; object-fit: cover; object-position: center center; }
  .imgbox .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
                  background: linear-gradient(to top, var(--black), rgba(10,10,10,0)); }
  .item { display: flex; align-items: baseline; gap: 40px; padding: 22px 0; border-bottom: 1px solid rgba(226,201,138,.22); }
  .item:last-child { border-bottom: none; }
  .num { color: var(--champagne); font-weight: 700; min-width: 60px; }
  .check-row { display: flex; align-items: center; gap: 26px; }
  .check { width: 58px; height: 58px; flex: none; }
  .btn { display: inline-block; background: var(--champagne); color: #111; font-family: "Segoe UI", Arial, sans-serif;
         font-weight: 700; letter-spacing: 3px; text-transform: uppercase; padding: 30px 64px; border-radius: 3px; flex: none; }
  .framed-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, #2a2117 0%, var(--black) 70%); }
  .framed-img { position: absolute; left: 90px; right: 90px; top: 360px; bottom: 90px; display: flex; align-items: center; justify-content: center; }
  .framed-img img { max-width: 100%; max-height: 100%; box-shadow: 0 30px 80px rgba(0,0,0,.7); border: 2px solid rgba(226,201,138,.5); }
  .script { position: absolute; font-family: "Great Vibes", cursive; color: var(--champagne); font-size: 112px; line-height: 0.95;
            text-shadow: 0 3px 22px rgba(0,0,0,.55); text-align: right; }
  .script.top-right { top: 90px; right: 70px; } .script.top-left { top: 90px; left: 70px; text-align: left; }
  .script.bottom-right { bottom: 420px; right: 70px; }
  .arrow { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.62);
           font: 300 64px "Segoe UI", Arial, sans-serif; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .logo { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 520px; mix-blend-mode: screen; }
</style></head>
<body><div class="c layout-guide">









  <div class="imgbox" style="height:990px"><img src="FILE"><div class="fade"></div></div>
  <div class="panel" style="height:360px">
    <div class="region top" data-fit style="top:46px;height:280px">
      <div class="rule"></div>
  <p class="eyebrow">Gratitude + love</p>
  <h1 data-fs="50" style="font-size:50px">For Mom</h1>
  <div class="gap" style="height:18px"></div>
  <p class="sub gold" data-fs="32" style="font-size:32px">Send her the thank you.</p>
  <div class="gap" style="height:14px"></div><p class="note" data-fs="26">So she can keep your picture close.</p>
    </div>
  </div>



<div class="script top-right">Forever</div>
<div class="arrow">›</div>

</div>
<script>
  // Shrink text inside every [data-fit] region until it fits (never below 55% of the design size).
  function fits(region) {  // measures the real extent of the children (works for bottom/center aligned regions too)
    var kids = Array.prototype.filter.call(region.children, function (k) { return k.offsetHeight > 0; });
    if (!kids.length) return true;
    var r = region.getBoundingClientRect();
    var top = Math.min.apply(null, kids.map(function (k) { return k.getBoundingClientRect().top; }));
    var bottom = Math.max.apply(null, kids.map(function (k) { return k.getBoundingClientRect().bottom; }));
    var wide = kids.some(function (k) { return k.scrollWidth > k.clientWidth + 1; });
    return bottom - top <= r.height + 1 && !wide;
  }
  function fitAll() {
    document.querySelectorAll("[data-fit]").forEach(function (region) {
      var els = region.querySelectorAll("[data-fs]");
      for (var scale = 1.0; scale >= 0.55; scale -= 0.03) {
        els.forEach(function (el) { el.style.fontSize = (parseFloat(el.dataset.fs) * scale) + "px"; });
        if (fits(region)) break;
      }
    });
    window.__fitDone = true;
  }
  var imgs = Array.prototype.slice.call(document.images);
  Promise.all(imgs.map(function (i) {
    return i.complete ? Promise.resolve() : new Promise(function (r) { i.onload = i.onerror = r; });
  })).then(function () { return document.fonts ? document.fonts.ready : null; }).then(fitAll);
</script>
</body></html>
