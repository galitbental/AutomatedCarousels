<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='15' font-weight='700' fill='%23D9C08A' text-anchor='middle'%3EBW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand"><div class="brand-mark">BW</div>
    <div><div class="brand-be">BE WISHED</div><div class="brand-sub">Carousel Studio</div></div></div>
  <nav>
    <div class="side-label">Workspace</div>
    <button class="nav" data-view="queue" id="nav-queue"><span class="ico">☰</span>Queue<span class="count" id="queue-count"></span></button>
    <div id="nav-jobs"></div>
    <button class="nav" data-view="library" id="nav-library"><span class="ico">✦</span>Style library</button>
    <div class="side-label">System</div>
    <button class="nav" data-view="settings" id="nav-settings"><span class="ico">⚙</span>Settings</button>
    <button class="nav" data-view="system" id="nav-system"><span class="ico">✓</span>System check</button>
  </nav>
  <div class="side-foot" id="mode-note"></div>
</aside>
<main id="main">
  <header id="topbar">
    <div id="crumb"></div>
    <div id="tasks"></div>
  </header>
  <section id="view"></section>
</main>
<div id="logdrawer" class="collapsed">
  <div id="loghead"><span>Activity log</span><span id="loglast"></span><span id="logtoggle">▲</span></div>
  <div id="loglist"></div>
</div>
<div id="modal" class="hidden"></div>
<div id="lightbox" class="hidden"><img alt=""><div class="lb-cap"></div></div>
<div id="toasts"></div>
<script src="/web/app.js"></script>
</body>
</html>
